<a class="skip-link" href="#main-content" (click)="skipToMain($event)" i18n="@@shell.skipLink"
  >Skip to main content</a
>

<app-header
  [homePath]="homePath()"
  [settingsPath]="settingsPath()"
  [userName]="userName()"
  [actions]="topBarActions()"
  [actionStyle]="isDesktop() ? 'full' : 'icon'"
  [showShortcuts]="shortcutsEnabled()"
  (actionTriggered)="run($event)"
  (logoutRequested)="logoutRequested.emit()"
/>

<div class="body">
  @if (isDesktop()) {
    <app-navigation variant="rail" [items]="navItems()" />
  }
  <main #main id="main-content" tabindex="-1">
    <ng-content />
  </main>
</div>

@if (!isDesktop()) {
  @if (fabAction(); as action) {
    <button
      mat-fab
      type="button"
      class="fab"
      [attr.aria-label]="action.accessibleLabel ?? action.label"
      (click)="run(action)"
    >
      <mat-icon aria-hidden="true">{{ action.icon }}</mat-icon>
    </button>
  }
  <app-navigation variant="bottom" [items]="navItems()" />
}
